```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Expense</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

    <div class="container py-5">

        <!-- Heading -->
        <div class="text-center mb-4">
            <h1>Edit Expense</h1>
            <p class="text-muted">Update your expense details</p>
        </div>


        <!-- Edit Form -->
        <div class="card shadow-sm">

            <div class="card-body">

                <h2 class="h4 mb-4">Expense Details</h2>

                <form method="POST" action="/update">

                    <!-- Hidden ID -->
                    <input
                        type="hidden"
                        name="id"
                        value="{{ expense['id'] }}"
                    >


                    <!-- Amount -->
                    <div class="mb-3">

                        <label class="form-label">
                            Amount
                        </label>

                        <input
                            type="number"
                            name="amount"
                            value="{{ expense['amount'] }}"
                            class="form-control"
                        >

                    </div>


                    <!-- Category -->
                    <div class="mb-3">

                        <label class="form-label">
                            Category
                        </label>

                        <input
                            type="text"
                            name="category"
                            value="{{ expense['category'] }}"
                            class="form-control"
                        >

                    </div>


                    <!-- Description -->
                    <div class="mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <input
                            type="text"
                            name="description"
                            value="{{ expense['description'] }}"
                            class="form-control"
                        >

                    </div>


                    <!-- Update Button -->
                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Update Expense
                    </button>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
